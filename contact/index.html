    <!-- v i d e o  &  h e r o  -->
 	<header id="bgimage" class="border-bottom">
	  <div class="container h-100">
		<div class="row h-100">
		  <div class="col-md-6 d-flex align-items-center">
			<div id="helloBox" class="p-4  rounded">
			  <h1 class="display-3 text-white">Contact</h1>
			</div>
		  </div>
		</div>
	  </div>
	</header>
	
    <!-- s e c t i o n  1 -->
    <section class="section mt-5 mb-5" id="contact">
      <div class="container mt-5">
        <h4 class="w-responsive mx-auto mb-5">Please reach out if you have any questions.</h4>
		<p><b>+1 250-814-8786</b></p>
		<p><b>davislogo@gmail.com</b></p>
        <div class="row">
          <div class="col-md-9 mb-md-0 mb-5 mt-5">
            <form action="https://formspree.io/f/mgejpgwk" id="contact-form" name="contact-form" method="POST">
              <div class="row">
                <div class="col-md-6 mt-5">
                  <div class="md-form mb-0">
                    <input type="text" id="name" name="name" class="form-control">
                    <label for="name" class="">Your name</label>
                  </div>
                </div>
                <div class="col-md-6 mt-5">
                  <div class="md-form mb-0">
                    <input type="text" id="email" name="email" class="form-control" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"> <label for="email" class="">Your email</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12 mt-5">
                  <div class="md-form mb-0">
                    <input type="text" id="subject" name="subject" class="form-control">
                    <label for="subject" class="">Subject</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12 mt-5">
                  <div class="md-form">
                    <textarea type="text" id="message" name="message" rows="2" class="form-control md-textarea"></textarea>
                    <label for="message">Your message</label>
                  </div>
                </div>
              </div>
              <div class="text-center text-md-left">
                <input class="btn btn-primary" type="submit">
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
    <!-- f o o t e r  -->
